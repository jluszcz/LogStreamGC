[package]
name = "log-stream-gc"
authors = ["Jacob Luszcz"]
default-run = "log-stream-gc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# `default` pulls in the `rustls` feature, which is the legacy hyper-0.14 client stack
# (rustls 0.21 / rustls-webpki 0.101) that nothing here uses and that no longer receives
# security fixes. `default-https-client` is the modern rustls 0.23 path the SDK actually calls.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
jluszcz_rust_utils = { git = "https://github.com/jluszcz/rust-utils", features = ["aws", "cli", "lambda"] }
lambda_runtime = "1"
log = "0.4"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[[bin]]
name = "log-stream-gc"
path = "src/main.rs"

[[bin]]
name = "lambda"
path = "src/lambda.rs"
